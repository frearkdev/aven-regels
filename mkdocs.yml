site_name: Aven Roleplay — APV
site_url: https://regels.avenrp.nl/
site_description: Algemene Plaatselijke Verordening van Aven Roleplay
copyright: Aven Roleplay • APV • Versie 1.0
docs_dir: docs
theme:
  name: material
  language: nl
  logo: assets/arp-transparant.png
  favicon: assets/favicon-64.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    scheme: slate
  features:
    - navigation.top
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.code.copy
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: "Link naar dit artikel"
      toc_depth: 2
plugins: []
nav:
  - APV: index.md
